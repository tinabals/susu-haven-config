apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: susu-haven
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPLACE_WITH_PUBLIC_REPO_URL
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: lab
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
# Starts with manual sync. Enable auto-sync/self-heal in Experiment 3.
